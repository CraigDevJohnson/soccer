version: '3'

# One deployment per site environment, chosen with ENV (default dev): its
# committed inputs are infra/environments/<ENV>.tfvars and <ENV>.tfbackend,
# its plan infra/soccer.<ENV>.tfplan, and its provider cache
# infra/.terraform.<ENV>, so two environments never share a state or a plan.
# The Deploy workflow runs these same tasks; on a computer they are for
# testing (docs/operations/deploy.md). For example: task infra:plan ENV=prod
vars:
  ENV: '{{.ENV | default "dev"}}'
  # Every tofu command names its provider cache on its own command line. A
  # Taskfile `env` value would lose to a TF_DATA_DIR already exported in the
  # shell (Task's rule: the process environment wins), and then `ENV=prod`
  # would silently keep using dev's cache and backend.
  TOFU: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/.terraform.{{.ENV}}" tofu'
  ARCHIVE_TOFU: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/archive/.terraform.{{.ENV}}" tofu -chdir=infra/archive'
  TOFU_OFFLINE: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/.terraform" tofu'
  TOFU_BOOTSTRAP: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/bootstrap/.terraform" tofu'
  TOFU_BOOTSTRAP_OFFLINE: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/bootstrap/.terraform.offline" tofu'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  collector:test:
    desc: Test the collector and local explorer offline (run collector:setup first)
    cmds:
      - node --check scripts/boise_collect/web/app.js
      - python3 -m unittest discover -s scripts/boise_collect/tests -v

  collector:setup:
    desc: Install the locked Bruno CLI locally; does not collect data
    cmds:
      - npm ci --prefix scripts/boise_collect/bruno --ignore-scripts --no-audit --no-fund

  collector:install:
    desc: Install a committed collector release and launcher under the user's Application Support directory
    cmds:
      - python3 -m scripts.boise_collect.install {{.CLI_ARGS}}

  explorer:run:
    desc: Browse the durable archive locally at http://127.0.0.1:8767
    cmds:
      - python3 -m scripts.boise_collect.explorer --data-dir "${LPS_DATA_DIR:-$HOME/Library/Application Support/LPS Boise Collector/data/boise-history}" {{.CLI_ARGS}}

  explorer:test:
    desc: Test read-only archive queries and HTTP boundaries
    cmds:
      - node --check scripts/boise_collect/web/app.js
      - python3 -m unittest scripts.boise_collect.tests.test_explorer_data scripts.boise_collect.tests.test_explorer_http -v

  archive:export:
    desc: Create a private immutable generation from a locked local dataset
    cmds:
      - python3 -m scripts.boise_collect.publication export {{.CLI_ARGS}}

  archive:verify:
    desc: Restore the complete generation into temporary storage and verify it
    cmds:
      - python3 -m scripts.boise_collect.publication verify {{.CLI_ARGS}}

  archive:restore:
    desc: Restore a verified generation to a new local directory
    cmds:
      - python3 -m scripts.boise_collect.publication restore {{.CLI_ARGS}}

  archive:stage:
    desc: Upload an approved generation with its short-lived staging role
    cmds:
      - python3 -m scripts.boise_collect.transfer stage {{.CLI_ARGS}}

  archive:image:build:
    desc: Build and load the Arm Lambda worker image locally
    cmds:
      - docker buildx build --platform linux/arm64 --provenance=false --sbom=false --load --build-arg "ARCHIVE_SOURCE_REVISION=$(git rev-parse HEAD)" --file scripts/boise_collect/Dockerfile.archive --tag soccer-archive-worker:local .

  archive:infra:check:
    desc: Validate and test the archive infrastructure with a mock provider
    cmds:
      - tofu fmt -check -recursive infra/archive
      - TF_DATA_DIR="{{.ROOT_DIR}}/infra/archive/.terraform.offline" tofu -chdir=infra/archive init -backend=false -input=false -lockfile=readonly >/dev/null
      - TF_DATA_DIR="{{.ROOT_DIR}}/infra/archive/.terraform.offline" tofu -chdir=infra/archive validate
      - TF_DATA_DIR="{{.ROOT_DIR}}/infra/archive/.terraform.offline" tofu -chdir=infra/archive test

  archive:infra:init:
    desc: Initialize the separate selected archive state for an infrastructure plan
    deps: [archive:infra:inputs]
    cmds:
      - '{{.ARCHIVE_TOFU}} init -input=false -lockfile=readonly -backend-config="../environments/archive-{{.ENV}}.tfbackend"'

  archive:infra:plan:
    desc: Write the selected archive plan for review
    deps: [archive:infra:inputs]
    cmds:
      - '{{.ARCHIVE_TOFU}} plan -input=false -lock-timeout=5m -var-file="../environments/archive-{{.ENV}}.tfvars" -out="archive.{{.ENV}}.tfplan"'

  archive:infra:apply:
    desc: Apply a specifically approved archive plan
    deps: [archive:infra:inputs]
    cmds:
      - '{{.ARCHIVE_TOFU}} apply -input=false -lock-timeout=5m "archive.{{.ENV}}.tfplan"'

  archive:infra:inputs:
    internal: true
    silent: true
    requires:
      vars:
        - name: ENV
          enum: [dev, prod]
    preconditions:
      - sh: git diff --quiet HEAD -- infra/archive/.terraform.lock.hcl
        msg: The archive provider lock must match the reviewed commit
      - sh: test -n "${AWS_PROFILE:-}" || test -n "${AWS_ACCESS_KEY_ID:-}"
        msg: Select the workloads account credentials for this archive plan

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -l -w cmd internal

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l cmd internal)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-formatted (run: task fmt):"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  ci:
    desc: Everything a pull-request check would run; needs no credentials
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: collector:test
      - task: infra:check

  run:
    desc: Serve on a developer's computer at http://127.0.0.1:8081
    cmds:
      - go run ./cmd/soccer

  lambda:
    desc: Build the Lambda zip, one static arm64 binary named bootstrap (ADR 0002)
    cmds:
      - mkdir -p dist/soccer
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/soccer/bootstrap ./cmd/soccer
      # The same source gives the same zip, so a deploy plan with no code
      # change reports none: the binary carries no build path or commit
      # (-trimpath, -buildvcs=false), and the archive carries a fixed mode and
      # time and no extra fields (-X) instead of this build's.
      - cd dist/soccer && chmod 0755 bootstrap && TZ=UTC touch -t 198001010000 bootstrap && rm -f ../soccer.zip && TZ=UTC zip -q -X ../soccer.zip bootstrap
      - ls -l dist/soccer.zip

  infra:fmt:
    desc: Format the OpenTofu files
    cmds:
      - tofu fmt -recursive infra

  infra:check:
    desc: Format, validate and test both OpenTofu roots offline; needs no credentials
    cmds:
      - tofu fmt -check -recursive infra
      # Read-only like infra:init, so a lock file out of step with the
      # configuration fails here, not in the Deploy run after a merge.
      - '{{.TOFU_OFFLINE}} -chdir=infra init -backend=false -input=false -lockfile=readonly >/dev/null'
      - '{{.TOFU_OFFLINE}} -chdir=infra validate'
      - '{{.TOFU_OFFLINE}} -chdir=infra test'
      - '{{.TOFU_BOOTSTRAP_OFFLINE}} -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly >/dev/null'
      - '{{.TOFU_BOOTSTRAP_OFFLINE}} -chdir=infra/bootstrap validate'
      - '{{.TOFU_BOOTSTRAP_OFFLINE}} -chdir=infra/bootstrap test'
      - task: archive:infra:check

  infra:init:
    desc: Point the ENV deployment (default dev) at its state (infra/environments/<ENV>.tfbackend)
    deps: [infra:inputs]
    cmds:
      # Init also installs any provider the state names, and the Deploy jobs
      # write the state, so only the committed lock file chooses providers
      # (infra:inputs refuses a changed one): a provider it lacks stops the
      # init, and no plan will start it with this computer's credentials.
      # Never drop the flag to get past that stop (docs/operations/deploy.md).
      - '{{.TOFU}} -chdir=infra init -input=false -lockfile=readonly -backend-config=environments/{{.ENV}}.tfbackend'

  infra:plan:
    desc: Build the zip and plan the ENV deployment (default dev) into infra/soccer.<ENV>.tfplan (task infra:init first)
    deps: [lambda]
    cmds:
      - task: infra:plan:zip
        vars: { ENV: '{{.ENV}}' }

  infra:plan:zip:
    desc: Plan the ENV deployment with the zip already in dist/soccer.zip, as the Deploy workflow does with its build job's zip
    deps: [infra:inputs]
    preconditions:
      - sh: test -f dist/soccer.zip
        msg: "No dist/soccer.zip: run task lambda, or task infra:plan, which builds it"
    cmds:
      # The zip's path is relative to infra/ and goes into the state, so a plan
      # here and one in the Deploy workflow agree on it. A plan or apply that
      # finds the state locked (by a run elsewhere) waits for it a while.
      - '{{.TOFU}} -chdir=infra plan -input=false -lock-timeout=5m -var-file=environments/{{.ENV}}.tfvars -var "package_path=../dist/soccer.zip" -out=soccer.{{.ENV}}.tfplan'

  infra:apply:
    desc: Apply the plan infra:plan wrote for ENV (default dev), exactly as reviewed (an approved change)
    deps: [infra:inputs]
    preconditions:
      - sh: test -f infra/soccer.{{.ENV}}.tfplan
        msg: "No infra/soccer.{{.ENV}}.tfplan: run task infra:plan ENV={{.ENV}} and review it first"
    cmds:
      - '{{.TOFU}} -chdir=infra apply -input=false -lock-timeout=5m soccer.{{.ENV}}.tfplan'

  infra:smoke:
    desc: Check the ENV deployment answers through its site and refuses unsigned calls (after an apply)
    deps: [infra:inputs]
    cmds:
      - |
        link_base_url=$({{.TOFU}} -chdir=infra output -raw link_base_url)
        function_url=$({{.TOFU}} -chdir=infra output -raw function_url)
        sh scripts/smoke.sh "$link_base_url" "$function_url"

  # Shared by the deployment tasks: ENV must name a committed deployment, the
  # provider lock file must be the committed one, and AWS credentials must be
  # chosen: a profile on a computer, or the keys the Deploy workflow's OIDC
  # sign-in puts in the environment.
  infra:inputs:
    internal: true
    silent: true
    preconditions:
      - sh: test -f infra/environments/{{.ENV}}.tfvars && test -f infra/environments/{{.ENV}}.tfbackend
        msg: "No deployment named {{.ENV}}: ENV must be dev or prod (infra/environments/)"
      - sh: git diff --quiet HEAD -- infra/.terraform.lock.hcl
        msg: "infra/.terraform.lock.hcl differs from the commit. Deployments use only the committed lock file: commit a deliberate provider change first, or restore it with git checkout -- infra/.terraform.lock.hcl"
      - sh: test -n "${AWS_PROFILE:-}" || test -n "${AWS_ACCESS_KEY_ID:-}"
        msg: "No AWS credentials: set AWS_PROFILE to the workloads account's admin profile, then: aws sso login"

  infra:bootstrap:init:
    desc: Point infra/bootstrap (the deploy roles, applied by hand once) at its state, with the admin profile
    deps: [infra:bootstrap:admin]
    cmds:
      - '{{.TOFU_BOOTSTRAP}} -chdir=infra/bootstrap init -input=false'

  infra:bootstrap:plan:
    desc: Plan infra/bootstrap into infra/bootstrap/bootstrap.tfplan, with the admin profile
    deps: [infra:bootstrap:admin]
    cmds:
      - '{{.TOFU_BOOTSTRAP}} -chdir=infra/bootstrap plan -input=false -out=bootstrap.tfplan'

  infra:bootstrap:apply:
    desc: Apply the plan infra:bootstrap:plan wrote, exactly as reviewed (an approved change)
    deps: [infra:bootstrap:admin]
    preconditions:
      - sh: test -f infra/bootstrap/bootstrap.tfplan
        msg: "No infra/bootstrap/bootstrap.tfplan: run task infra:bootstrap:plan and review it first"
    cmds:
      - '{{.TOFU_BOOTSTRAP}} -chdir=infra/bootstrap apply -input=false bootstrap.tfplan'

  # The deploy roles cannot create themselves, so infra/bootstrap runs only
  # with the workloads account's admin profile on a computer.
  infra:bootstrap:admin:
    internal: true
    silent: true
    preconditions:
      - sh: test -n "${AWS_PROFILE:-}"
        msg: "Set AWS_PROFILE to the workloads account's admin profile, then: aws sso login"
