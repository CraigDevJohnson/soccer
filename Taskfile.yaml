version: '3'

# One deployment per site environment, chosen with ENV (default dev): its
# committed inputs are infra/environments/<ENV>.tfvars and <ENV>.tfbackend,
# its plan infra/soccer.<ENV>.tfplan, and its provider cache
# infra/.terraform.<ENV>, so two environments never share a state or a plan.
# The Deploy workflow runs these same tasks; on a computer they are for
# testing (docs/operations/deploy.md). For example: task infra:plan ENV=prod
vars:
  ENV: '{{.ENV | default "dev"}}'
  # Every tofu command names its provider cache on its own command line. A
  # Taskfile `env` value would lose to a TF_DATA_DIR already exported in the
  # shell (Task's rule: the process environment wins), and then `ENV=prod`
  # would silently keep using dev's cache and backend.
  TOFU: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/.terraform.{{.ENV}}" tofu'
  TOFU_OFFLINE: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/.terraform" tofu'
  TOFU_BOOTSTRAP: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/bootstrap/.terraform" tofu'
  TOFU_BOOTSTRAP_OFFLINE: 'TF_DATA_DIR="{{.ROOT_DIR}}/infra/bootstrap/.terraform.offline" tofu'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -l -w cmd internal

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l cmd internal)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-formatted (run: task fmt):"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  ci:
    desc: Everything a pull-request check would run; needs no credentials
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: infra:check

  run:
    desc: Serve on a developer's computer at http://127.0.0.1:8081
    cmds:
      - go run ./cmd/soccer

  lambda:
    desc: Build the Lambda zip, one static arm64 binary named bootstrap (ADR 0002)
    cmds:
      - mkdir -p dist/soccer
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/soccer/bootstrap ./cmd/soccer
      # The same source gives the same zip, so a deploy plan with no code
      # change reports none: the binary carries no build path or commit
      # (-trimpath, -buildvcs=false), and the archive carries a fixed mode and
      # time and no extra fields (-X) instead of this build's.
      - cd dist/soccer && chmod 0755 bootstrap && TZ=UTC touch -t 198001010000 bootstrap && rm -f ../soccer.zip && TZ=UTC zip -q -X ../soccer.zip bootstrap
      - ls -l dist/soccer.zip

  infra:fmt:
    desc: Format the OpenTofu files
    cmds:
      - tofu fmt -recursive infra

  infra:check:
    desc: Format, validate and test both OpenTofu roots offline; needs no credentials
    cmds:
      - tofu fmt -check -recursive infra
      - '{{.TOFU_OFFLINE}} -chdir=infra init -backend=false -input=false >/dev/null'
      - '{{.TOFU_OFFLINE}} -chdir=infra validate'
      - '{{.TOFU_OFFLINE}} -chdir=infra test'
      - '{{.TOFU_BOOTSTRAP_OFFLINE}} -chdir=infra/bootstrap init -backend=false -input=false >/dev/null'
      - '{{.TOFU_BOOTSTRAP_OFFLINE}} -chdir=infra/bootstrap validate'
      - '{{.TOFU_BOOTSTRAP_OFFLINE}} -chdir=infra/bootstrap test'

  infra:init:
    desc: Point the ENV deployment (default dev) at its state (infra/environments/<ENV>.tfbackend)
    deps: [infra:inputs]
    cmds:
      - '{{.TOFU}} -chdir=infra init -input=false -backend-config=environments/{{.ENV}}.tfbackend'

  infra:plan:
    desc: Build the zip and plan the ENV deployment (default dev) into infra/soccer.<ENV>.tfplan (task infra:init first)
    deps: [lambda]
    cmds:
      - task: infra:plan:zip
        vars: { ENV: '{{.ENV}}' }

  infra:plan:zip:
    desc: Plan the ENV deployment with the zip already in dist/soccer.zip, as the Deploy workflow does with its build job's zip
    deps: [infra:inputs]
    preconditions:
      - sh: test -f dist/soccer.zip
        msg: "No dist/soccer.zip: run task lambda, or task infra:plan, which builds it"
    cmds:
      # The zip's path is relative to infra/ and goes into the state, so a plan
      # here and one in the Deploy workflow agree on it. A plan or apply that
      # finds the state locked (by a run elsewhere) waits for it a while.
      - '{{.TOFU}} -chdir=infra plan -input=false -lock-timeout=5m -var-file=environments/{{.ENV}}.tfvars -var "package_path=../dist/soccer.zip" -out=soccer.{{.ENV}}.tfplan'

  infra:apply:
    desc: Apply the plan infra:plan wrote for ENV (default dev), exactly as reviewed (an approved change)
    deps: [infra:inputs]
    preconditions:
      - sh: test -f infra/soccer.{{.ENV}}.tfplan
        msg: "No infra/soccer.{{.ENV}}.tfplan: run task infra:plan ENV={{.ENV}} and review it first"
    cmds:
      - '{{.TOFU}} -chdir=infra apply -input=false -lock-timeout=5m soccer.{{.ENV}}.tfplan'

  infra:smoke:
    desc: Check the ENV deployment answers through its site and refuses unsigned calls (after an apply)
    deps: [infra:inputs]
    cmds:
      - |
        link_base_url=$({{.TOFU}} -chdir=infra output -raw link_base_url)
        function_url=$({{.TOFU}} -chdir=infra output -raw function_url)
        sh scripts/smoke.sh "$link_base_url" "$function_url"

  # Shared by the deployment tasks: ENV must name a committed deployment, and
  # AWS credentials must be chosen: a profile on a computer, or the keys the
  # Deploy workflow's OIDC sign-in puts in the environment.
  infra:inputs:
    internal: true
    silent: true
    preconditions:
      - sh: test -f infra/environments/{{.ENV}}.tfvars && test -f infra/environments/{{.ENV}}.tfbackend
        msg: "No deployment named {{.ENV}}: ENV must be dev or prod (infra/environments/)"
      - sh: test -n "${AWS_PROFILE:-}" || test -n "${AWS_ACCESS_KEY_ID:-}"
        msg: "No AWS credentials: set AWS_PROFILE to the workloads account's admin profile, then: aws sso login"

  infra:bootstrap:init:
    desc: Point infra/bootstrap (the deploy roles, applied by hand once) at its state, with the admin profile
    deps: [infra:bootstrap:admin]
    cmds:
      - '{{.TOFU_BOOTSTRAP}} -chdir=infra/bootstrap init -input=false'

  infra:bootstrap:plan:
    desc: Plan infra/bootstrap into infra/bootstrap/bootstrap.tfplan, with the admin profile
    deps: [infra:bootstrap:admin]
    cmds:
      - '{{.TOFU_BOOTSTRAP}} -chdir=infra/bootstrap plan -input=false -out=bootstrap.tfplan'

  infra:bootstrap:apply:
    desc: Apply the plan infra:bootstrap:plan wrote, exactly as reviewed (an approved change)
    deps: [infra:bootstrap:admin]
    preconditions:
      - sh: test -f infra/bootstrap/bootstrap.tfplan
        msg: "No infra/bootstrap/bootstrap.tfplan: run task infra:bootstrap:plan and review it first"
    cmds:
      - '{{.TOFU_BOOTSTRAP}} -chdir=infra/bootstrap apply -input=false bootstrap.tfplan'

  # The deploy roles cannot create themselves, so infra/bootstrap runs only
  # with the workloads account's admin profile on a computer.
  infra:bootstrap:admin:
    internal: true
    silent: true
    preconditions:
      - sh: test -n "${AWS_PROFILE:-}"
        msg: "Set AWS_PROFILE to the workloads account's admin profile, then: aws sso login"
