# Checks, as the dev deploy role, that its alarm guard also refuses an OK or
# insufficient-data action other than notifying the alerts topic
# (scripts/check-alarm-guard.sh). Run by hand on main (Run workflow), only
# after Craig approves the run, because it changes AWS: each run makes and
# deletes a throwaway alarm for its allowed control, and makes it again if the
# guard does not hold. See docs/operations/deploy.md, "Checking the alarm
# guard".
name: Check alarm guard

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the dev deploy role's alarm guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev # the dev deploy role trusts only jobs in this environment
    concurrency: alarm-guard-dev
    permissions:
      id-token: write # assume the dev deploy role through OIDC
      contents: read
    steps:
      - name: Check the environment was set up
        env:
          ROLE_ARN: ${{ vars.AWS_DEV_DEPLOYER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::The dev environment has no AWS_DEV_DEPLOYER_ROLE_ARN; set it up first (docs/operations/deploy.md, One-time setup)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Try alarms with a decoy in each action list
        run: bash scripts/check-alarm-guard.sh
