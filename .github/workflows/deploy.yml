# Builds the backend once, deploys that build to dev, then to production after
# Craig approves the production job as the GitHub environment's reviewer
# (aws-design.md G11). Runs on every push to main that changes what is
# deployed, and by hand (Run workflow) on main. See docs/operations/deploy.md.
#
# The deploy roles (infra/bootstrap) trust a job through GitHub OIDC only with
# the subject repo:CraigDevJohnson@42454849/soccer@1412575682:environment:dev
# or ...:environment:production, so each deploy job must declare its
# environment. What keeps every other branch out is each environment's
# main-only branch policy, set up before the roles exist. Each job reads its
# role from a variable set only in its environment, so a run before that
# setup stops at its first step.
name: Deploy

on:
  push:
    branches: [main]
    paths: # the "Check main has not moved on" steps name the same paths
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - infra/**
      - '!infra/bootstrap/**'
      - '!infra/tests/**'
      - scripts/smoke.sh
      - Taskfile.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: go test
        run: task test

      - name: Build the Lambda zip
        run: task lambda

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soccer-${{ github.sha }}
          path: dist/soccer.zip
          if-no-files-found: error
          retention-days: 30

  dev:
    name: Deploy dev
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ steps.smoke.outputs.site }}
    concurrency: deploy-dev # a second run waits; it is never cancelled mid-apply
    permissions:
      id-token: write # assume the dev deploy role through OIDC
      contents: read
    env:
      ENV: dev
      TF_CLI_ARGS: -no-color # plain text for the log and the summary
    steps:
      - name: Check the environment was set up
        env:
          ROLE_ARN: ${{ vars.AWS_DEV_DEPLOYER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::The dev environment has no AWS_DEV_DEPLOYER_ROLE_ARN; set it up first (docs/operations/deploy.md, One-time setup)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check main has not moved on
        # A newer commit to main that changes what is deployed has its own
        # run, which deploys it. Applying this older one after that (an old
        # approval, or a re-run) would roll dev back, so it stops.
        # The paths are the push trigger's.
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet HEAD FETCH_HEAD -- cmd internal go.mod go.sum infra ':(exclude)infra/bootstrap' ':(exclude)infra/tests' scripts/smoke.sh Taskfile.yaml .github/workflows/deploy.yml; then
            echo "::error::main has newer changes to what is deployed; their own Deploy run deploys dev" >&2
            exit 1
          fi

      - name: Fetch the zip the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soccer-${{ github.sha }}
          path: dist

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Plan
        run: |
          task infra:init ENV="$ENV"
          task infra:plan:zip ENV="$ENV" | tee plan.txt
          {
            echo "## OpenTofu plan: $ENV"
            echo
            echo '```text'
            grep -E '^(  # |Plan:|No changes\.)' plan.txt || echo "(nothing to report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the plan keeps the function's role
        # The deploy role may not make, replace or remove the function's role,
        # or change its trust or session length (infra/bootstrap). An apply
        # would first remove what depends on the role, the function included
        # when it is renamed, and only then be refused, so such a plan stops
        # here and changes nothing; it is applied from a computer instead
        # (docs/operations/deploy.md).
        run: |
          TF_DATA_DIR="$PWD/infra/.terraform.$ENV" tofu -chdir=infra show -json "soccer.$ENV.tfplan" > plan.json
          if ! jq -e '[.resource_changes[]? | select(.address == "aws_iam_role.server") | .change
              | select((.actions | any(. == "create" or . == "delete"))
                or .before.assume_role_policy != .after.assume_role_policy
                or .before.max_session_duration != .after.max_session_duration)]
              | length == 0' plan.json > /dev/null; then
            echo "::error::This plan makes, replaces or removes the function's role, or changes its trust, which the deploy role may not do. Apply it from a computer (docs/operations/deploy.md, The deploy roles)" >&2
            exit 1
          fi

      - name: Apply
        run: task infra:apply ENV="$ENV"

      - name: Smoke test
        id: smoke
        run: |
          task infra:smoke ENV="$ENV"
          link_base_url=$(TF_DATA_DIR="$PWD/infra/.terraform.$ENV" tofu -chdir=infra output -raw link_base_url)
          echo "site=${link_base_url%/link/}" >> "$GITHUB_OUTPUT"

  production:
    name: Deploy production
    needs: [build, dev]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production # requires Craig's approval in GitHub
      url: ${{ steps.smoke.outputs.site }}
    concurrency: deploy-production
    permissions:
      id-token: write # assume the production deploy role through OIDC
      contents: read
    env:
      ENV: prod
      TF_CLI_ARGS: -no-color # plain text for the log and the summary
    steps:
      - name: Check the environment was set up
        env:
          ROLE_ARN: ${{ vars.AWS_PROD_DEPLOYER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::The production environment has no AWS_PROD_DEPLOYER_ROLE_ARN; set it up first (docs/operations/deploy.md, One-time setup)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check main has not moved on
        # A newer commit to main that changes what is deployed has its own
        # run, which deploys it. Applying this older one after that (an old
        # approval, or a re-run) would roll production back, so it stops.
        # The paths are the push trigger's.
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet HEAD FETCH_HEAD -- cmd internal go.mod go.sum infra ':(exclude)infra/bootstrap' ':(exclude)infra/tests' scripts/smoke.sh Taskfile.yaml .github/workflows/deploy.yml; then
            echo "::error::main has newer changes to what is deployed; their own Deploy run deploys production" >&2
            exit 1
          fi

      - name: Fetch the same zip dev got
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soccer-${{ github.sha }}
          path: dist

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOYER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Plan
        run: |
          task infra:init ENV="$ENV"
          task infra:plan:zip ENV="$ENV" | tee plan.txt
          {
            echo "## OpenTofu plan: $ENV"
            echo
            echo '```text'
            grep -E '^(  # |Plan:|No changes\.)' plan.txt || echo "(nothing to report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the plan keeps the function's role
        # The deploy role may not make, replace or remove the function's role,
        # or change its trust or session length (infra/bootstrap). An apply
        # would first remove what depends on the role, the function included
        # when it is renamed, and only then be refused, so such a plan stops
        # here and changes nothing; it is applied from a computer instead
        # (docs/operations/deploy.md).
        run: |
          TF_DATA_DIR="$PWD/infra/.terraform.$ENV" tofu -chdir=infra show -json "soccer.$ENV.tfplan" > plan.json
          if ! jq -e '[.resource_changes[]? | select(.address == "aws_iam_role.server") | .change
              | select((.actions | any(. == "create" or . == "delete"))
                or .before.assume_role_policy != .after.assume_role_policy
                or .before.max_session_duration != .after.max_session_duration)]
              | length == 0' plan.json > /dev/null; then
            echo "::error::This plan makes, replaces or removes the function's role, or changes its trust, which the deploy role may not do. Apply it from a computer (docs/operations/deploy.md, The deploy roles)" >&2
            exit 1
          fi

      - name: Apply
        run: task infra:apply ENV="$ENV"

      - name: Smoke test
        id: smoke
        run: |
          task infra:smoke ENV="$ENV"
          link_base_url=$(TF_DATA_DIR="$PWD/infra/.terraform.$ENV" tofu -chdir=infra output -raw link_base_url)
          echo "site=${link_base_url%/link/}" >> "$GITHUB_OUTPUT"
